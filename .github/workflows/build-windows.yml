name: Build Windows

on:
  push:
    branches:
      - develop
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop

jobs:
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-msvc-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-msvc-cargo-

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdvi-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/mdvi.exe
          retention-days: 30

  # Cross-compile from Ubuntu as a secondary check (gnu target)
  crossbuild-windows-gnu:
    name: Cross-compile (x86_64-pc-windows-gnu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-gnu-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu-gnu-cargo-

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdvi-windows-x86_64-gnu
          path: target/x86_64-pc-windows-gnu/release/mdvi.exe
          retention-days: 30

  # On version tags, attach the MSVC binary to a GitHub Release
  release:
    name: Attach to GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mdvi-windows-x86_64
          path: dist/

      - name: Rename binary with version
        run: mv dist/mdvi.exe dist/mdvi-${{ github.ref_name }}-x86_64-windows.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mdvi-${{ github.ref_name }}-x86_64-windows.exe
